<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Spendly, přehledné účetnictví</title>
</head>
<body>
    <header>
        <span class="logo">S</span>
        <div>
            <h1>Spendly</h1>
            <p>Příjmy, výdaje a zůstatek na jednom místě.</p>
        </div>
    </header>

    <main class="rozlozeni">
        <!-- Přehled se počítá z JavaScriptu. -->
        <section id="souhrn">
            <h2>Přehled financí</h2>
            <p>Příjmy: <span id="souhrnPrijmy">0 Kč</span></p>
            <p>Výdaje: <span id="souhrnVydaje">0 Kč</span></p>
            <p>Bilance: <span id="souhrnBilance">0 Kč</span></p>
        </section>

        <!-- Formulář pro nový záznam. -->
        <section>
            <h2>Přidat záznam</h2>
            <form id="formularTransakce">
                <div>
                    <label for="datum">Datum</label>
                    <input type="date" id="datum" name="datum">
                </div>
                <div>
                    <label for="typ">Typ</label>
                    <select id="typ" name="typ">
                        <option value="prijem">Příjem</option>
                        <option value="vydaj">Výdaj</option>
                    </select>
                </div>
                <div>
                    <label for="kategorie">Kategorie</label>
                    <input type="text" id="kategorie" name="kategorie">
                </div>
                <div>
                    <label for="popis">Popis</label>
                    <input type="text" id="popis" name="popis">
                </div>
                <div>
                    <label for="castka">Částka</label>
                    <input type="number" id="castka" name="castka">
                </div>
                <button type="submit">Přidat záznam</button>
            </form>
        </section>

        <!-- Seznam záznamů. -->
        <section>
            <h2>Záznamy</h2>
            <p id="prazdnyStav">Zatím tu nic není. Přidej první záznam.</p>
            <table id="tabulka">
                <thead>
                    <tr>
                        <th>Datum</th>
                        <th>Typ</th>
                        <th>Kategorie</th>
                        <th>Popis</th>
                        <th>Částka</th>
                        <th>Akce</th>
                    </tr>
                </thead>
                <tbody id="tabulkaTela"></tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
